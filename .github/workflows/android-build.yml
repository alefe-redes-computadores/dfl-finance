name: DFL Finance Mobile Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-export:
    name: Validate mobile export
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Mobile contracts
        run: npm run mobile:check

      - name: Build mobile export
        env:
          NEXT_PUBLIC_DFL_SERVER_ORIGIN: https://dfl-finance.vercel.app
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build:mobile

      - name: Verify mobile export
        run: npm run mobile:verify

      - name: Ensure Android is still gated
        run: |
          test ! -d android
          echo "OK: android/ ainda não gerado."

      - name: Upload mobile web bundle
        uses: actions/upload-artifact@v4
        with:
          name: dfl-finance-mobile-web
          path: out/
          if-no-files-found: error
          retention-days: 3

name: Compilar APK DFL

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite rodar manualmente se precisar!

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Dependências
        run: npm install

      - name: Build do Next.js (Arquivos estáticos)
        run: npm run build

      - name: Criar o App Android (A Mágica da Nuvem)
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar o APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar o APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: DFL-Finance-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
